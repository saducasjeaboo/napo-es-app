name: Build Android apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # The default package list includes "tools", which no longer exists in
          # Google's SDK repository and makes the action fail.
          packages: "platform-tools"

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Point Bubblewrap at the toolchains
        run: |
          set -euo pipefail
          # Bubblewrap only accepts an SDK that has cmdline-tools/latest/bin/sdkmanager,
          # while the runner image ships a versioned directory (e.g. cmdline-tools/16.0).
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            latest=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/ | grep -v '/latest/$' | head -1)
            ln -s "${latest%/}" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          ls "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          bubblewrap --version
          bubblewrap doctor

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret is missing."
            exit 1
          fi
          for d in android/public android/admin; do
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$d/android.keystore"
          done

      - name: Build public app (Napo ES)
        working-directory: android/public
        env:
          RUN_NUMBER: ${{ github.run_number }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs");const f="twa-manifest.json";const j=JSON.parse(fs.readFileSync(f));j.appVersionCode=Number(process.env.RUN_NUMBER);fs.writeFileSync(f,JSON.stringify(j,null,2));'
          bubblewrap build --skipPwaValidation
          cp app-release-signed.apk "$GITHUB_WORKSPACE/napo-es.apk"

      - name: Build admin app (NES Admin)
        working-directory: android/admin
        env:
          RUN_NUMBER: ${{ github.run_number }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs");const f="twa-manifest.json";const j=JSON.parse(fs.readFileSync(f));j.appVersionCode=Number(process.env.RUN_NUMBER);fs.writeFileSync(f,JSON.stringify(j,null,2));'
          bubblewrap build --skipPwaValidation
          cp app-release-signed.apk "$GITHUB_WORKSPACE/nes-admin.apk"

      - name: Signing fingerprint + assetlinks.json
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          FP=$(keytool -list -v -keystore android/public/android.keystore \
                 -alias "${KEY_ALIAS:-napo}" -storepass "$KEYSTORE_PASSWORD" \
               | grep -i 'SHA256:' | head -1 | sed 's/.*SHA256: //' | tr -d '\r')
          echo "SHA-256: $FP"
          cat > assetlinks.json <<EOF
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "je.site.napoelementaryschool.twa",
                "sha256_cert_fingerprints": ["$FP"]
              }
            },
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "je.site.napoelementaryschool.admin",
                "sha256_cert_fingerprints": ["$FP"]
              }
            }
          ]
          EOF
          cat assetlinks.json

      - uses: actions/upload-artifact@v4
        with:
          name: android-apps
          path: |
            napo-es.apk
            nes-admin.apk
            assetlinks.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: Napo ES apps v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Napo ES (public site) and NES Admin (admin panel) — Android.

            - `napo-es.apk` — installs as **Napo ES**
            - `nes-admin.apk` — installs as **NES Admin**
            - `assetlinks.json` — upload to `/.well-known/assetlinks.json` on the site
              (removes the address bar; not required for the app to work)

            Android will ask you to allow installing from this source the first time.
          files: |
            napo-es.apk
            nes-admin.apk
            assetlinks.json
