name: Make signing keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore
        run: |
          set -euo pipefail
          ALIAS=napo
          STOREPASS="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 28)"
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STOREPASS" -keypass "$STOREPASS" \
            -dname "CN=Napo Elementary School, OU=Napo ES, O=Napo Elementary School, L=Carcar City, ST=Cebu, C=PH"
          base64 -w0 android.keystore > keystore.b64
          printf '%s' "$STOREPASS" > storepass.txt
          printf '%s' "$ALIAS" > alias.txt
          echo "SHA-256 fingerprint:"
          keytool -list -v -keystore android.keystore -alias "$ALIAS" -storepass "$STOREPASS" | grep -i 'SHA256:' | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: napo-keystore
          retention-days: 1
          path: |
            keystore.b64
            storepass.txt
            alias.txt
